services:
  gerrit:
    image: gerritcodereview/gerrit  # better: pin to a specific release tag
    container_name: gerrit
    restart: unless-stopped
 
    ports:
      - "8081:8081"    # Web UI
      - "29418:29418"  # SSH (git push for review, gerrit commands)
 
    # Persist everything important (git repos, DB, index, cache, config)
    volumes:
      - gerrit_git:/var/gerrit/git
      - gerrit_index:/var/gerrit/index
      - gerrit_cache:/var/gerrit/cache
      - gerrit_db:/var/gerrit/db
      - gerrit_etc:/var/gerrit/etc
 
    # Minimal “configuration knobs” supported by the image:
    environment:
      - CANONICAL_WEB_URL=http://192.168.42.145:8081
      - HTTPD_LISTEN_URL=http://*:8081/
volumes:
  gerrit_git:
  gerrit_index:
  gerrit_cache:
  gerrit_db:
  gerrit_etc:
